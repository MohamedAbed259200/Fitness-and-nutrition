<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الممارسة اليومية</title>
     <!-- 
    - favicon
  -->
  <link rel="shortcut icon" href="./favicon.svg" type="image/svg+xml">
    <style>
        body {
            font-family: Arial, sans-serif;
            direction: rtl;
            text-align: right;
            background-color: #0f4402;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 80%;
            margin: auto;
            background: white;
            padding: 20px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
            border-radius: 10px;
        }
        h1 {
            color: #2c3e50;
        }
        .exercise-list {
            list-style: none;
            padding: 0;
        }
        .exercise-list li {
            background: #e3e3e3;
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        .exercise-list li:hover {
            background: #d1d1d1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>الممارسة اليومية</h1>
        <p>قم بممارسة التمارين التالية يوميًا للحفاظ على لياقتك البدنية وصحتك:</p>
        <ul class="exercise-list">
            <li onclick="showMessage('تمرين الضغط يعزز قوة العضلات العلوية.')">تمرين الضغط</li>
            <li onclick="showMessage('تمرين القرفصاء يقوي عضلات الأرجل ويحسن التوازن.')">تمرين القرفصاء</li>
            <li onclick="showMessage('تمرين الجري يساعد في تحسين صحة القلب والأوعية الدموية.')">تمرين الجري</li>
            <li onclick="showMessage('تمرين البلانك يعزز قوة الجذع ويحسن الاستقرار.')">تمرين البلانك</li>
        </ul>
        <p id="message" style="font-weight: bold; color: #e74c3c;"></p>
    </div>
    <script>
        function showMessage(message) {
            document.getElementById('message').innerText = message;
        }
    </script>
</body>
</html>
